<script>
        // Твои правильные CSV-ссылки (я их уже поправил)
        const URL_WEEK = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpyea_eUAA1nfnJFtK7jrvnO6M3ny4aXSzFn7OO8bhQyHiA1pY74xH05p4AZQCWSR54N2JnfOq6_8X/pub?output=csv&gid=2067344733";
        const URL_MONTH = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpyea_eUAA1nfnJFtK7jrvnO6M3ny4aXSzFn7OO8bhQyHiA1pY74xH05p4AZQCWSR54N2JnfOq6_8X/pub?output=csv&gid=929155732";

        let currentUrl = URL_WEEK; // При загрузке сайта показываем неделю

        async function fetchData() {
            // Включаем "скелетоны" загрузки, пока данные летят из таблицы
            document.getElementById('niches-container').innerHTML = '<div class="skeleton loading-shimmer"></div><div class="skeleton loading-shimmer" style="width: 80%"></div>';
            document.getElementById('products-container').innerHTML = '<div class="product-card"><div class="skeleton" style="width:60px; height:60px; border-radius:8px;"></div><div style="flex:1"><div class="skeleton loading-shimmer" style="width:70%"></div><div class="skeleton loading-shimmer" style="width:40%"></div></div></div>';

            try {
                const response = await fetch(currentUrl);
                const data = await response.text();
                
                // Разбиваем CSV на строки и колонки
                const rows = data.split('\n').map(row => row.split(',').map(c => c.replace(/"/g, '').trim()));

                // Берем первые 5 строк (Ниши)
                const nichesData = rows.slice(0, 5).map(row => ({
                    name: row[0],
                    growth: row[1] || ""
                })).filter(n => n.name);

                // Пропускаем пустую строку и берем Топ-10 товаров (с 7-й строки)
                const productsData = rows.slice(6).map(row => ({
                    title: row[0],
                    price: parseInt(row[1])?.toLocaleString('ru-RU') + ' ₸',
                    img: row[2]
                })).filter(p => p.title && p.img).slice(0, 10);

                renderNiches(nichesData);
                renderProducts(productsData);
            } catch (e) {
                console.error("Ошибка загрузки данных из Google Таблицы:", e);
                document.getElementById('niches-container').innerHTML = '<div style="color:red">Ошибка загрузки данных</div>';
            }
        }

        // Функция отрисовки ниш
        function renderNiches(niches) {
            const container = document.getElementById('niches-container');
            container.innerHTML = niches.map(n => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #EAEAEA">
                    <div style="color:var(--kz-color); font-weight:600; font-size:14px;">${n.name}</div>
                    <div style="background:${n.growth.startsWith('+') ? 'rgba(180,255,135,0.3)' : 'rgba(255,135,135,0.2)'}; 
                                padding:4px 10px; border-radius:8px; font-weight:800; 
                                color:${n.growth.startsWith('+') ? 'var(--kz-color)' : '#D32F2F'}">
                        ${n.growth}
                    </div>
                </div>
            `).join('');
        }

        // Функция отрисовки товаров
        function renderProducts(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = products.map((p, i) => `
                <div class="product-card">
                    <div class="product-image" style="background-image: url('${p.img}')">
                        <div class="product-rank">${i+1}</div>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price}</div>
                    </div>
                    <a href="#" class="buy-button">Көру</a>
                </div>
            `).join('');
        }

        // Обработка кликов по кнопкам "Неделя" / "Месяц"
        document.getElementById('btn-week').addEventListener('click', function() {
            if(currentUrl === URL_WEEK) return; // Если уже открыта неделя - ничего не делаем
            this.classList.add('active');
            document.getElementById('btn-month').classList.remove('active');
            currentUrl = URL_WEEK;
            fetchData();
        });

        document.getElementById('btn-month').addEventListener('click', function() {
            if(currentUrl === URL_MONTH) return; // Если уже открыт месяц - ничего не делаем
            this.classList.add('active');
            document.getElementById('btn-week').classList.remove('active');
            currentUrl = URL_MONTH;
            fetchData();
        });

        // Запуск при загрузке страницы
        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
